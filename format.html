<!DOCTYPE html>
<html>
<head>
    <title>Formulir Sederhana</title>
</head>
<body>
    <h2>Formulir Pendaftaran</h2>
    <form action="#" method="post">
        <!-- Input Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Masukkan email Anda"><br><br>

        <!-- Input Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Masukkan password"><br><br>

        <!-- Radio Button -->
        <label>Jenis Kelamin:</label><br>
        <input type="radio" id="laki" name="gender" value="Laki-laki">
        <label for="laki">Laki-laki</label>
        <input type="radio" id="perempuan" name="gender" value="Perempuan">
        <label for="perempuan">Perempuan</label><br><br>

        <!-- Checkbox -->
        <label>Hobi:</label><br>
        <input type="checkbox" id="membaca" name="hobi" value="Membaca">
        <label for="membaca">Membaca</label>
        <input type="checkbox" id="menulis" name="hobi" value="Menulis">
        <label for="menulis">Menulis</label><br><br>

        <!-- Dropdown -->
        <label for="pekerjaan">Pekerjaan:</label>
        <select id="pekerjaan" name="pekerjaan">
            <option value="">Pilih Pekerjaan</option>
            <option value="Pelajar">Pelajar</option>
            <option value="Mahasiswa">Mahasiswa</option>
            <option value="Karyawan">Karyawan</option>
            <option value="Wiraswasta">Wiraswasta</option>
        </select><br><br>

        <!-- Textarea -->
        <label for="alamat">Alamat:</label><br>
        <textarea id="alamat" name="alamat" rows="4" cols="30" placeholder="Masukkan alamat lengkap"></textarea><br><br>

        <!-- Tombol Kirim -->
        <input type="submit" value="Kirim">
    </form>
</body>
</html>
